name: OpenFX CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m compileall -q .
      - name: Validate JSON files
        run: |
          python -m json.tool schemas/experiment-v1.schema.json > /dev/null
          python -m json.tool schemas/source-registry-v1.schema.json > /dev/null
          python -m json.tool schemas/claim-register-v1.schema.json > /dev/null
          python -m json.tool data/source_registry.example.json > /dev/null
          python -m json.tool data/claim_register.example.json > /dev/null
          python -m json.tool worker/worker_config.example.json > /dev/null
      - name: Run experiment and repository tests
        run: python -m unittest discover -s tests -v
      - name: Run worker regression tests
        run: python -m unittest worker.test_worker -v
      - name: Run worker offline self-test
        run: python worker/openfx_worker.py --self-test
